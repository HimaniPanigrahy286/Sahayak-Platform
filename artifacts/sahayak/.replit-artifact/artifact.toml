kind = "web"
previewPath = "/"
title = "Sahayak"
version = "1.0.0"
id = "artifacts/sahayak"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23291

[services.development]
run = "pnpm --filter @workspace/sahayak run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sahayak", "run", "build" ]
serve = "static"
publicDir = "artifacts/sahayak/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23291"
BASE_PATH = "/"
